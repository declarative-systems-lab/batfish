
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.18.2.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 192.18.1.2 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 192.18.2.1 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 192.18.5.2 255.255.255.252
 negotiation auto
!
!
!
router bgp 200
 bgp router-id 192.18.2.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as100 peer-group
 neighbor as100 remote-as 100
 neighbor as300 peer-group
 neighbor as300 remote-as 300
 neighbor as500 peer-group
 neighbor as500 remote-as 500
 neighbor 192.18.1.1 peer-group as100
 neighbor 192.18.2.2 peer-group as300
 neighbor 192.18.5.1 peer-group as500
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  !neighbor as200 next-hop-self
  neighbor as100 send-community both
  neighbor as100 route-map R2_OUT_TO_R1 out
  neighbor as300 send-community both
  neighbor as500 send-community both
  neighbor as500 route-map R2_IN_FROM_ISP2 in
  neighbor as500 route-map R2_OUT_TO_ISP2 out
  neighbor 192.18.1.1 activate
  neighbor 192.18.2.2 activate
  neighbor 192.18.5.1 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
ip community-list 400110 permit 400:110
!
ip community-list 400120 permit 400:120
!
ip community-list 500210 permit 500:210
!
ip community-list 500220 permit 500:220
!
ip community-list 100210 permit 100:210
!
ip community-list 100220 permit 100:220
!
ip community-list 200110 permit 200:110
!
!
!
ip prefix-list default_ips seq 5 permit 0.0.0.0/0 le 32
!
ip prefix-list isp2_network1 seq  5 permit 202.0.110.0/20   ge 20
ip prefix-list isp2_network1 seq 10 permit 202.0.111.0/20   ge 20
ip prefix-list isp2_network1 seq 15 permit 202.0.113.0/24   ge 24
ip prefix-list isp2_network1 seq 20 permit 203.0.120.0/20   ge 24
ip prefix-list isp2_network1 seq 25 permit 203.0.121.0/24   ge 24
ip prefix-list isp2_network1 seq 30 permit 203.0.123.0/24   ge 24
ip prefix-list isp2_network1 seq 35 permit 203.0.124.0/24   ge 24
ip prefix-list isp2_network1 seq 40 deny   203.0.100.0/25   ge 26
ip prefix-list isp2_network1 seq 45 permit 203.0.120.0/25   ge 26
ip prefix-list isp2_network1 seq 50 deny   203.0.120.0/25   ge 29
ip prefix-list isp2_network1 seq 55 deny   202.0.113.0/24   ge 25
ip prefix-list isp2_network1 seq 60 deny   203.0.113.0/24   ge 25
ip prefix-list isp2_network1 seq 65 permit 203.100.111.0/20 ge 24
ip prefix-list isp2_network1 seq 70 permit 203.100.112.0/20 ge 24
ip prefix-list isp2_network1 seq 75 permit 203.200.113.0/20 ge 24
ip prefix-list isp2_network1 seq 80 permit 203.200.114.0/20 ge 24
!
ip prefix-list isp2_network2 seq  5 permit 203.51.110.0/20  ge 20
ip prefix-list isp2_network2 seq 10 permit 203.51.111.0/20  ge 20
ip prefix-list isp2_network2 seq 15 permit 203.51.112.0/20  ge 20
ip prefix-list isp2_network2 seq 20 permit 203.0.110.0/24   ge 24
ip prefix-list isp2_network2 seq 25 permit 203.0.111.0/24   ge 24
ip prefix-list isp2_network2 seq 30 deny   192.0.0.0/4      ge 24
ip prefix-list isp2_network2 seq 35 permit 203.113.111.0/20 ge 24
ip prefix-list isp2_network2 seq 40 permit 203.113.112.0/20 ge 24
ip prefix-list isp2_network2 seq 45 permit 203.113.113.0/20 ge 24
ip prefix-list isp2_network2 seq 50 permit 203.0.113.0/24   ge 24
ip prefix-list isp2_network2 seq 55 permit 203.0.115.0/24   ge 24
ip prefix-list isp2_network2 seq 60 deny   203.113.0.128/25 ge 26
ip prefix-list isp2_network2 seq 65 permit 203.113.111.0/25 ge 26
ip prefix-list isp2_network2 seq 70 deny   203.113.111.0/25 ge 29
ip prefix-list isp2_network2 seq 75 deny   203.0.113.128/25 ge 26
ip prefix-list isp2_network2 seq 80 deny   0.0.0.0/0        le 32
!
!
!
route-map R2_IN_FROM_ISP2 permit 10
 match ip address prefix-list isp2_network1
 set community 500:210 additive
!
route-map R2_IN_FROM_ISP2 permit 20
 match ip address prefix-list isp2_network2
 set community 500:220 additive
!
route-map R2_IN_FROM_ISP2 deny 100
!
!
route-map R2_OUT_TO_ISP2 deny 10
 match community 400110
!
route-map R2_OUT_TO_ISP2 permit 20
 match community 400120
!
route-map R2_OUT_TO_ISP2 deny 30
 match community 100210
!
route-map R2_OUT_TO_ISP2 permit 40
 match community 100220
!
route-map R2_OUT_TO_ISP2 permit 50
 match community 200110
!
route-map R2_OUT_TO_ISP2 permit 100
 match ip address prefix-list default_ips
!
!
route-map R2_OUT_TO_R1 permit 10
 set community 200:110
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
