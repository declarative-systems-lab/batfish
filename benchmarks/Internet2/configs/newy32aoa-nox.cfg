!
! External AS 10578 — minimal peer for Internet2 benchmark (newy32aoa CONNECTOR).
! Reuses existing newy32aoa production peering:
!   newy32aoa  192.5.89.222/30  AS 11537  (group CONNECTOR in newy32aoa.cfg)
!   nox2 192.5.89.221/30  AS 10578
!   [RE] NOX | I2-S12532
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname nox2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
!
ip tcp synwait-time 5
!
interface Loopback0
 ip address 192.5.89.221 255.255.255.255
!
interface GigabitEthernet0/0
 description "eBGP peering to newy32aoa (Internet2 AS 11537)"
 ip address 192.5.89.221 255.255.255.252
 no shutdown
 duplex full
 speed 1000
!
router bgp 10578
 bgp router-id 192.5.89.221
 bgp log-neighbor-changes
 neighbor 192.5.89.222 remote-as 11537
 neighbor 192.5.89.222 description "Internet2 newy32aoa CONNECTOR"
 !
 address-family ipv4
  network 100.64.10.0 mask 255.255.255.0
  network 205.213.200.0 mask 255.255.255.0
  network 128.10.50.0 mask 255.255.255.0
  network 128.2.100.0 mask 255.255.255.0
  network 128.206.50.0 mask 255.255.255.0
  network 128.101.10.0 mask 255.255.255.0
  network 63.193.200.0 mask 255.255.255.0
  network 198.48.92.0 mask 255.255.255.0
  network 74.115.8.0 mask 255.255.255.0
  network 63.164.11.0 mask 255.255.255.0
  neighbor 192.5.89.222 activate
 exit-address-family
!
ip forward-protocol nd
!
ip route 100.64.10.0 255.255.255.0 Null0
ip route 205.213.200.0 255.255.255.0 Null0
ip route 128.10.50.0 255.255.255.0 Null0
ip route 128.2.100.0 255.255.255.0 Null0
ip route 128.206.50.0 255.255.255.0 Null0
ip route 128.101.10.0 255.255.255.0 Null0
ip route 63.193.200.0 255.255.255.0 Null0
ip route 198.48.92.0 255.255.255.0 Null0
ip route 74.115.8.0 255.255.255.0 Null0
ip route 63.164.11.0 255.255.255.0 Null0
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
end
